<html lang="en">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config={theme:{extend:{fontFamily:{display:["Fraunces","serif"],sans:["Manrope","sans-serif"]},colors:{brand:{50:"#f2f7ee",100:"#e2edd8",200:"#c3dbae",300:"#a0c67f",400:"#7cae57",500:"#5c9139",600:"#47752b",700:"#385c23",800:"#2e4a1f",900:"#26401c"},clay:{500:"#c1652f",600:"#a8531f"},cream:"#faf8f2"}}}}
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--ink:#26401c;--ink-soft:#5b6b52;--line:#e3e0d4;--surface:#ffffff;--bg:#f4f2ea;--accent:#47752b;--accent-dark:#2e4a1f;--focus:#c1652f;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
    *{font-family:'Manrope',sans-serif}
    h1,h2,h3,.font-display{font-family:'Fraunces',serif}
    html{-webkit-text-size-adjust:100%}
    html,body{overflow-x:hidden;max-width:100vw}
    body{background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
    button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
    ::selection{background:#dbe9cd}
    /* Mobile-safety: iOS auto-zooms any input/select under 16px on focus, which feels
       broken/jerky on a phone. Force 16px specifically on touch-sized screens, while
       keeping the tighter desktop sizing untouched. */
    @media (max-width:767px){
      .input,select.input,textarea.input,input{font-size:16px!important}
      .btn{font-size:.86rem}
    }
    /* Any horizontally-scrollable strip (tables, family tree, alerts) should feel like a
       native scroller on touch, not a jerky/clipped patch. */
    .overflow-auto,.scrollbar{-webkit-overflow-scrolling:touch}
    .scrollbar::-webkit-scrollbar{width:8px;height:8px}.scrollbar::-webkit-scrollbar-thumb{background:#d6d2c2;border-radius:20px}.scrollbar::-webkit-scrollbar-track{background:transparent}
    :focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
    .nav-active{background:var(--accent-dark);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(46,74,31,.28)}
    .nav-item{min-height:46px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(38,64,28,.04)}
    .input{width:100%;border:1.5px solid #d8d4c5;border-radius:9px;padding:.65rem .8rem;outline:none;background:#fff;font-size:.92rem;color:var(--ink);transition:border-color .12s,box-shadow .12s}
    .input:hover{border-color:#c3bea9}
    .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(71,117,43,.15)}
    .input:disabled{background:#f2f1ea;color:#9a9686;cursor:not-allowed}
    label.block>.input,label.block>select.input,label.block>textarea.input{margin-top:.4rem}
    label.block{font-size:.8rem;font-weight:700;color:var(--ink-soft);letter-spacing:.01em}
    .btn{border-radius:10px;padding:.68rem 1rem;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;border:1.5px solid transparent;min-height:42px;transition:background-color .12s,border-color .12s,transform .08s}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}
    .btn-soft{background:#eef1e6;color:var(--accent-dark);border-color:#e2e6d5}.btn-soft:hover{background:#e4e8d8;border-color:#d3d8c2}
    .btn-danger{background:#fbeae4;color:#9a3412;border-color:#f6d9cd}.btn-danger:hover{background:#f7dccf}
    .badge{font-size:.7rem;font-weight:700;border-radius:999px;padding:.28rem .62rem;display:inline-block;letter-spacing:.01em}
    .toast{animation:in .2s ease}@keyframes in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    .modal-bg{background:rgba(28,32,20,.55);backdrop-filter:blur(1px)}.hide-scroll::-webkit-scrollbar{display:none}
    .spinner{width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
    details.info summary{list-style:none;cursor:pointer}details.info summary::-webkit-details-marker{display:none}details.info summary::marker{content:""}
    details.info[open] summary{background:#d8d4c5}
    .nav-section-label{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#a9c191;padding:.9rem .75rem .3rem}
    .nav-item.nav-idle{color:#e4ecd8}
    .nav-item.nav-idle:hover{background:rgba(255,255,255,.1);color:#fff}
    .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:box-shadow .15s,transform .15s}
    .stat-card:hover{box-shadow:0 4px 14px rgba(38,64,28,.08);transform:translateY(-1px)}
    .hero-panel{background:linear-gradient(135deg,#2e4a1f 0%,#385c23 55%,#47752b 100%);color:#fff}
    table thead th{font-weight:800}
    table tbody tr{transition:background-color .1s}
    table tbody tr:hover{background:#f8f7f0}
    /* ---- Family tree (Blood Line) ---- */
    .famtree,.famtree ul,.famtree li{margin:0;padding:0;list-style:none}
    .famtree{text-align:center}
    .famtree,.famtree ul{display:table;margin:0 auto}
    .famtree li{display:table-cell;vertical-align:top;text-align:center;padding:28px 10px 0 10px;position:relative}
    .famtree li::before,.famtree li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid #bbe3c8;width:50%;height:20px}
    .famtree li::after{right:auto;left:50%;border-left:2px solid #bbe3c8}
    .famtree li:only-child::after,.famtree li:only-child::before{display:none}
    .famtree li:only-child{padding-top:0}
    .famtree li:first-child::before,.famtree li:last-child::after{border:0 none}
    .famtree li:last-child::before{border-right:2px solid #bbe3c8;border-radius:0 6px 0 0}
    .famtree li:first-child::after{border-radius:6px 0 0 0}
    .famtree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid #bbe3c8;width:0;height:20px}
    .fam-card{display:inline-block;min-width:112px;max-width:132px}
    .fam-relation{font-size:10px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;min-height:12px}
    .fam-avatar{width:60px;height:60px;border-radius:999px;background:#f0fdf4;border:3px solid #dcfce7;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 6px;overflow:hidden}
    .fam-avatar img{width:100%;height:100%;object-fit:cover}
    .fam-card.selected .fam-avatar{border-color:#16a34a;box-shadow:0 0 0 4px #dcfce7}
    .fam-card.missing .fam-avatar{border-style:dashed;background:#f8fafc;opacity:.6}
    .fam-name{font-weight:700;font-size:12.5px;color:#14532d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px;margin:0 auto}
    .fam-sub{font-size:10.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px;margin:2px auto 0}
    /* ---- QR ear-tag + public bio-data profile ---- */
    .qr-box{background:#fff;border-radius:10px;padding:10px;display:inline-block;border:1px solid var(--line)}
    .qr-box img,.qr-box canvas{display:block;width:120px!important;height:120px!important}
    .qr-tag-card{width:220px;border:1.5px dashed #c9c4b0;border-radius:12px;padding:12px;text-align:center;background:#fff;break-inside:avoid;page-break-inside:avoid}
    .qr-tag-card .qr-box img,.qr-tag-card .qr-box canvas{width:100px!important;height:100px!important}
    @media print{
      body *{visibility:hidden}
      #printArea,#printArea *{visibility:visible}
      #printArea{position:absolute;left:0;top:0;width:100%}
      .no-print{display:none!important}
    }
    .bio-hero{background:linear-gradient(135deg,#2e4a1f 0%,#385c23 55%,#47752b 100%);color:#fff}
    .bio-avatar{width:88px;height:88px;border-radius:16px;background:#fff2;border:3px solid #ffffff33;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;flex-shrink:0}
    .bio-avatar img{width:100%;height:100%;object-fit:cover}
    .bio-stat{background:#f4f2ea;border-radius:12px;padding:12px 14px}
    .bio-stat span{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-soft)}
    .bio-stat b{display:block;font-size:1.05rem;margin-top:2px;color:var(--ink)}
    .bio-log-item{border-left:2px solid #dcdfd0;padding:2px 0 10px 14px;position:relative;font-size:.85rem}
    .bio-log-item::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:999px;background:var(--accent)}
    .bio-log-item:last-child{border-color:transparent}

    /* ---- Responsive tables ("rtable") ----
       Every data table on a small screen turns into a stack of cards instead of a tiny
       horizontally-scrolled grid — nothing to pinch-zoom, nothing cut off. Each <td> shows
       its column name via data-label; the first/identity cell (marked rt-main) becomes the
       card's title, and the actions cell (rt-actions) drops its label and right-aligns. */
    @media (max-width:719px){
      .rtable{overflow:visible!important}
      .rtable table,.rtable thead,.rtable tbody,.rtable tr,.rtable th,.rtable td{display:block}
      .rtable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
      .rtable tbody{display:flex;flex-direction:column;gap:10px}
      .rtable tr{border:1px solid var(--line);border-radius:12px;padding:2px 12px;background:#fff}
      .rtable td{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #ece9dc;text-align:right;min-height:26px}
      .rtable tr td:last-child{border-bottom:0}
      .rtable td::before{content:attr(data-label);font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);text-align:left;flex-shrink:0}
      .rtable td.rt-main{display:block;text-align:left;padding:12px 0 10px;font-size:.98rem}
      .rtable td.rt-main::before{content:none}
      .rtable td.rt-actions{justify-content:flex-end}
      .rtable td.rt-actions::before{content:none}
      .rtable td.rt-actions>div{width:100%}
      .rtable td.rt-actions .flex{width:100%;justify-content:flex-end}
      .rtable td input.input,.rtable td select.input{max-width:150px;margin-left:auto;text-align:right}
      .rtable td>span.badge{margin-left:auto}
    }

    /* ---- Toast: full-width, thumb-reachable, respects notch/home-indicator ---- */
    #toast{left:1rem;right:1rem;bottom:calc(1.1rem + var(--safe-b));display:flex;justify-content:center;pointer-events:none}
    #toast .toast{pointer-events:auto;max-width:480px;width:100%}
    @media (min-width:640px){#toast{left:auto}}

    /* ---- Modal: comfortable on small phones, sticky bars respect safe areas ---- */
    @media (max-width:640px){
      .modal-bg{padding:.6rem!important;align-items:flex-end!important}
      .modal-bg>div{max-height:88vh!important;border-radius:18px 18px 0 0!important;width:100%!important}
      .modal-actions{flex-direction:column-reverse!important;align-items:stretch!important}
      .modal-actions .btn{width:100%}
    }
    #modalRoot .p-5.border-t{padding-bottom:calc(1.25rem + var(--safe-b))}

    /* ---- Sidebar drawer: never wider than the viewport on very small phones ---- */
    #side{width:min(288px,86vw)}
  </style>
</head>

<div id="app"></div>
<div id="toast" class="fixed z-[100]"></div>
<div id="modalRoot"></div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyB4SZAFtG5FGdXkfWaKhvaw6r7UFfmcekw",
  authDomain:"gaushala-managment.firebaseapp.com",
  databaseURL:"https://gaushala-managment-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gaushala-managment",
  storageBucket:"gaushala-managment.firebasestorage.app",

  appId:"1:204886706588:web:102c6b87a40771c85a2059",

};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), auth=firebase.auth();

const state={
  page:"Dashboard", data:{}, search:"", modal:null, role:localStorage.gaushalaRole||"",
  cloud:{name:localStorage.cloudinaryName||"lw7coppb",preset:localStorage.cloudinaryPreset||"gaushala_images"}
};
const modules={
  Dashboard:["🏠","Dashboard"], Animals:["🐄","Animals"], Pregnancy:["🤰","Pregnancy"], Calves:["🐮","Calves"], "Blood Line":["🧬","Blood Line"],
  Milk:["🥛","Milk"], Feed:["🌾","Feed"], Health:["❤️","Health"], Medicines:["💊","Medicines"],
  Vaccination:["💉","Vaccination"], Deworming:["🛡️","Deworming"], "Tick Control":["🪲","Tick Control"], "Nail Cutting":["✂️","Nail Cutting"],
  Sheds:["🏠","Sheds"], Workers:["👷","Workers"], Tasks:["☑️","Tasks"], Expenses:["₹","Expenses"], Reports:["📊","Reports"], Settings:["⚙️","Settings"]
};
const APP_VERSION="v2.4";
const OWNER_PASSWORD="admin123";
// Only 2 logins now: Owner (password protected, full access) and Management Team
// (no password, sirf Milk module dikhta/chalta hai — kuch aur nahi).
const ROLE_PERMISSIONS={
 "Owner":null,
 "Management Team":{onlyModules:["Milk"]}
};
function currentPermissions(){return ROLE_PERMISSIONS[state.role]||null}
function isModuleHidden(m){
 const p=currentPermissions();
 if(!p)return false;
 if(p.onlyModules)return !p.onlyModules.includes(m);
 return !!(p.hiddenModules&&p.hiddenModules.includes(m));
}
function isModuleViewOnly(m){const p=currentPermissions();return !!(p&&p.viewOnly&&p.viewOnly.includes(m))}
// Some record "types" used with the generic openRecord/deleteRecord/genericTable helpers
// aren't real nav modules (e.g. MilkSources lives inside the Milk page), so their
// permission check should fall back to whichever nav module they logically belong to.
function permModule(type){return {MilkSources:"Milk"}[type]||type}
function loginScreen(){
 document.getElementById("app").innerHTML=`<div class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(1200px 600px at 15% -10%, #eef1e0 0%, var(--bg) 55%)">
  <div class="w-full max-w-md">
   <div class="text-center mb-6">
    <div class="w-14 h-14 rounded-2xl mx-auto mb-4 grid place-items-center text-2xl" style="background:var(--accent-dark)">🐄</div>
    <h1 class="font-display text-3xl font-semibold" style="color:var(--ink)">Gaushala Management</h1>
    <p class="text-sm mt-1.5" style="color:var(--ink-soft)">Sign in to continue to your dashboard</p>
   </div>
   <div class="card p-6 sm:p-7">
    <span class="block text-xs font-bold uppercase tracking-wide mb-3" style="color:var(--ink-soft)">Choose how you're signing in</span>
    <div class="space-y-3">
     <button class="btn btn-primary w-full justify-start !py-3.5 !px-4" onclick="attemptLogin('Owner')">
      <span class="w-9 h-9 rounded-lg bg-white/15 grid place-items-center text-lg shrink-0">👑</span>
      <span class="text-left"><span class="block">Owner</span><span class="block text-xs font-medium opacity-80">Full access · password required</span></span>
     </button>
     <button class="btn btn-soft w-full justify-start !py-3.5 !px-4" onclick="attemptLogin('Management Team')">
      <span class="w-9 h-9 rounded-lg bg-white grid place-items-center text-lg shrink-0 border" style="border-color:#e2e6d5">🥛</span>
      <span class="text-left"><span class="block">Management Team</span><span class="block text-xs font-medium opacity-70">Milk entry only · no password</span></span>
     </button>
    </div>
   </div>
   <p class="text-xs text-center mt-5" style="color:var(--ink-soft)">Management Team can only record milk. Every other module is Owner-only.</p>
  </div>
 </div>`;
}
function attemptLogin(role){
 if(role==="Owner"){ownerPasswordModal();return}
 finishLogin(role);
}
function ownerPasswordModal(){
 modal("👑 Owner Login",
  `<label class="block text-sm font-semibold text-slate-600">Password<input type="password" inputmode="text" autocomplete="current-password" class="input mt-1" id="ownerPass" placeholder="Owner password daalein" onkeydown="if(event.key==='Enter')submitOwnerPassword()"></label>
   <label class="flex items-center gap-2 mt-3 text-sm" style="color:var(--ink-soft)"><input type="checkbox" onchange="document.getElementById('ownerPass').type=this.checked?'text':'password'"> Show password</label>`,
  `<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitOwnerPassword()">Login</button>`
 );
 setTimeout(()=>document.getElementById("ownerPass")?.focus(),50);
}
function submitOwnerPassword(){
 const pass=document.getElementById("ownerPass")?.value||"";
 if(pass!==OWNER_PASSWORD){toast("Galat password",false);return}
 closeModal();
 finishLogin("Owner");
}
function finishLogin(role){
 state.role=role;
 localStorage.gaushalaRole=role;
 localStorage.gaushalaLoggedIn="1";
 state.page=role==="Management Team"?"Milk":"Dashboard";
 renderShell();
}
function logout(){
 localStorage.removeItem("gaushalaLoggedIn");
 localStorage.removeItem("gaushalaRole");
 state.role="";state.page="Dashboard";
 loginScreen();
}
function infoIcon(text){
 return `<details class="info relative inline-block align-middle ml-2"><summary class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 text-[11px] font-bold grid place-items-center hover:bg-slate-300" title="${esc(text)}">i</summary><div class="absolute z-30 top-full mt-2 left-0 w-60 max-w-[78vw] card p-3 text-xs text-slate-600 shadow-lg font-normal leading-relaxed break-words">${esc(text)}</div></details>`
}
document.addEventListener("click",e=>{
 document.querySelectorAll("details.info[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")});
});
const paths=["animals","pregnancies","calvings","milkRecords","milkSources","milkInsourceRecords","healthChecks","treatments","medicines","vaccinations","deworming","tickControl","nailCutting","feedInventory","feedRecords","feedPurchases","feedUsage","sheds","workers","tasks","expenses","income","quarantine","movements","births","notifications","mediaLog"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(prefix){return prefix+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";return (n/(1024*1024)).toFixed(2)+" MB"}
// Har status ka matlab — badge par hover/tap karne par dikhta hai (title tooltip).
const STATUS_MEANINGS={
 Healthy:"Animal theek-thaak hai, koi problem nahi.",
 Lactating:"Cow abhi doodh de rahi hai.",
 Pregnant:"Cow garbhvati (pregnant) hai.",
 Dry:"Cow doodh nahi de rahi — dry period chal raha hai.",
 Sick:"Animal beemar hai, dhyan/ilaj chahiye.",
 "Under Treatment":"Animal ka ilaj chal raha hai.",
 Quarantine:"Animal ko doosre animals se alag rakha gaya hai.",
 Emergency:"Turant dhyan/madad chahiye — critical condition.",
 Deceased:"Animal ki death ho chuki hai — record archive hai.",
 Completed:"Yeh kaam pura ho chuka hai.",
 Overdue:"Due date nikal chuki hai, abhi tak nahi hua.",
 Pending:"Abhi baaki/pending hai.",
 "In Progress":"Kaam abhi chal raha hai.",
 Skipped:"Yeh kaam is baar skip kar diya gaya.",
 Normal:"Sab kuchh normal hai.",
 Watch:"Halka issue hai, nazar rakhni hai.",
 Tracked:"Record track ho raha hai."
};
function badge(s){
  let c="bg-stone-100 text-stone-700"; if(["Healthy","Completed","Lactating"].includes(s))c="bg-[#e2edd8] text-[#2e4a1f]";
  if(["Pregnant","Under Treatment"].includes(s))c="bg-violet-100 text-violet-900"; if(["Sick","Emergency","Overdue"].includes(s))c="bg-red-100 text-red-800";
  if(["Pending","Quarantine","Dry"].includes(s))c="bg-amber-100 text-amber-900"; if(s==="Deceased")c="bg-stone-800 text-white";
  const title=STATUS_MEANINGS[s]?` title="${esc(STATUS_MEANINGS[s])}"`:"";
  return `<span class="badge ${c}"${title}>${esc(s||"—")}</span>`

// The QR encodes a link back to this same page with ?tag=<animalId>. Scanning it (any

function animalPublicUrl(animalId){

}
// Renders a QR code into #<elId>. Retries briefly if the qrcodejs CDN script hasn't
// finished loading yet (e.g. on a slow connection).
function renderQRInto(elId,text,size){
 size=size||120;
 const el=document.getElementById(elId);
 if(!el)return;
 el.innerHTML="";
 if(typeof QRCode==="undefined"){
  el.innerHTML=`<span class="text-xs text-stone-500">QR library load ho rahi hai...</span>`;
  setTimeout(()=>renderQRInto(elId,text,size),400);
  return;
 }
 new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
}
function qrImgSrcFromBox(elId){

 if(canvas)return canvas.toDataURL("image/png");
 return"";
}

function buildAnimalBio(animalId){
 const a=findAnimal(animalId);
 if(!a)return null;
 const milk=list("milkRecords").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 const last30=milk.filter(r=>daysTo(r.date)!==null&&daysTo(r.date)>=-30&&daysTo(r.date)<=0);
 const avgMilk=last30.length?(last30.reduce((s,r)=>s+Number(r.morning||0)+Number(r.evening||0),0)/last30.length):0;
 const mother=a.motherId?findAnimal(a.motherId):null;
 const father=a.fatherId?findAnimal(a.fatherId):null;
 const children=animals().filter(x=>x.motherId===animalId);
 const pregnancy=list("pregnancies").filter(r=>r.animalId===animalId).sort((x,y)=>(y.breedingDate||"").localeCompare(x.breedingDate||""))[0]||null;
 const health=list("healthChecks").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 const vacc=list("vaccinations").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 const deworm=list("deworming").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 const tick=list("tickControl").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 const nail=list("nailCutting").filter(r=>r.animalId===animalId).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
 return {a,mother,father,children,milk,avgMilk,pregnancy,health,vacc,deworm,tick,nail};
}

// Walks up the mother chain starting at startId, looking for targetId. Used to block
// self-references and circular blood lines (an animal can't be its own ancestor).
function motherChainIncludes(startId,targetId,guard){
 guard=guard||0;
 if(!startId||guard>25)return false;
 if(startId===targetId)return true;
 const a=findAnimal(startId);
 if(!a||!a.motherId)return false;
 return motherChainIncludes(a.motherId,targetId,guard+1);
}
// Number of mother-hops walking up from fromId until targetId is found (0 if same animal),
// or -1 if targetId isn't in fromId's mother chain. Used to label relations (Mother,
// Grandmother, Child, Grandchild...) relative to whichever animal is selected.
function chainDistance(fromId,toId,guard){
 guard=guard||0;
 if(!fromId||guard>30)return -1;
 if(fromId===toId)return 0;
 const a=findAnimal(fromId);
 if(!a||!a.motherId)return -1;
 const d=chainDistance(a.motherId,toId,guard+1);
 return d===-1?-1:d+1;
}
const ANCESTOR_LABELS=["","Mother","Grandmother","Great-grandmother"];
const DESCENDANT_LABELS=["","Child","Grandchild","Great-grandchild"];
function relationLabel(nodeId,selectedId){
 if(nodeId===selectedId)return "";
 let d=chainDistance(selectedId,nodeId);
 if(d>0)return ANCESTOR_LABELS[d]||(d+"x Great-grandmother");
 d=chainDistance(nodeId,selectedId);
 if(d>0)return DESCENDANT_LABELS[d]||(d+"x Great-grandchild");
 return "";
}
// Builds the full family tree (every mother→child link, branching) starting at animalId.
function buildFamilyTree(animalId,guard){
 guard=guard||{n:0};
 const a=findAnimal(animalId);
 if(!a||guard.n>400)return null;
 guard.n++;
 const kids=animals().filter(x=>x.motherId===animalId).sort((p,q)=>(p.dob||"").localeCompare(q.dob||"")).map(c=>buildFamilyTree(c.id,guard)).filter(Boolean);
 return {...a,children:kids};
}
function famCardHTML(node,selectedId){

 const rel=relationLabel(node.id,selectedId);
 return `<div class="fam-card ${node.id===selectedId?"selected":""}">

async function loadAll(){
  await Promise.all(paths.map(p=>new Promise(res=>{
   let firstSnapshot=true;
   db.ref(p).on("value",s=>{
    state.data[p]=s.val()||{};
    if(firstSnapshot){firstSnapshot=false;res();}
    else if(document.getElementById("content")){renderPage();}
   },err=>{console.error(p,err);if(firstSnapshot){firstSnapshot=false;res()}});
  })));
  if(localStorage.gaushalaLoggedIn==="1"&&ROLE_PERMISSIONS[localStorage.gaushalaRole]!==undefined){
   state.role=localStorage.gaushalaRole;
   if(isModuleHidden(state.page))state.page=state.role==="Management Team"?"Milk":"Dashboard";
   renderShell();
  }else{
   loginScreen();
  }
}

function buildAlerts(){
 const alerts=[];
 list("pregnancies").forEach(p=>{
  if(!p.expectedCalvingDate)return;
  const d=daysTo(p.expectedCalvingDate);
  if(d<=30){
   const an=findAnimal(p.animalId);
   alerts.push({type:"Pregnancy / Calving",icon:"🤰",animalId:p.animalId,animalName:an?an.name:"",due:p.expectedCalvingDate,days:d,extra:`Breeding: ${fmt(p.breedingDate)}`});
  }
 });
 [["vaccinations","Vaccination","💉"],["deworming","Deworming","🛡️"],["tickControl","Tick Control","🪲"],["nailCutting","Nail Cutting","✂️"]].forEach(([path,label,icon])=>{
  const latestByAnimal={};
  list(path).forEach(r=>{const k=r.animalId||"—";if(!latestByAnimal[k]||(r.date||"")>(latestByAnimal[k].date||""))latestByAnimal[k]=r});
  Object.values(latestByAnimal).forEach(r=>{
   if(!r.nextDueDate)return;
   const d=daysTo(r.nextDueDate);
   if(d<=15){
    const an=findAnimal(r.animalId);
    alerts.push({type:label,icon,animalId:r.animalId,animalName:an?an.name:"",due:r.nextDueDate,days:d,extra:""});
   }
  });
 });
 list("feedInventory").forEach(it=>{
  const min=Number(it.minimumStock||0);
  if(!min)return;
  const stock=feedStock(it.id);
  if(stock<=min){
   const days=feedDaysRemaining(it.id);
   alerts.push({type:"Feed Stock",icon:"🌾",animalId:it.name||it.id,animalName:"",due:days!==null?feedRunOutDate(it.id):today(),days:days!==null?days:0,extra:`Stock: ${stock.toFixed(1)} ${it.unit||""} (Minimum: ${min})`});
  }
 });
 alerts.sort((x,y)=>x.days-y.days);
 return alerts;
}

// Every path where a record can reference an animal via its "animalId" field.

const ANIMAL_LINKED_PATHS=["pregnancies","healthChecks","vaccinations","deworming","tickControl","nailCutting","milkRecords","births"];
async function deleteAnimal(animalId){
 if(isModuleViewOnly("Animals")){toast(`${state.role} role ke paas yeh permission nahi hai`,false);return}
 const a=findAnimal(animalId);
 if(!confirm(`${animalId}${a&&a.name?" ("+a.name+")":""} ko delete karein? Iske saath judi pregnancy, milk, health, vaccination, deworming, tick control, nail cutting aur birth records bhi delete ho jayenge — yeh wapas nahi ho sakta.`))return;
 try{
  const ops=[remove("animals",animalId)];
  ANIMAL_LINKED_PATHS.forEach(path=>{
   list(path).filter(r=>r.animalId===animalId).forEach(r=>ops.push(remove(path,r.id)));
  });
  await Promise.all(ops);
  toast("Animal aur uska poora linked data delete ho gaya");
 }catch(e){toast(e.message,false)}
}

async function submitAnimal(existing){

 if(!d.id){toast("Animal ID is required",false);return}
 if(!existing && findAnimal(d.id)){toast("This Animal ID already exists",false);return}
 if(d.motherId){
  if(d.motherId===d.id){toast("Animal apni khud ki Mother nahi ho sakta",false);return}
  if(motherChainIncludes(d.motherId,d.id)){toast("Yeh Mother ID circular blood line bana degi (is animal ka hi descendant hai)",false);return}
 }
 if(d.fatherId&&d.fatherId===d.id){toast("Animal apna khud ka Father nahi ho sakta",false);return}
 d.photo=window.currentPhoto||""; if(!d.id)d.id=id("COW");

}

async function submitRecord(type,key){
 const fields=recordFields[type];
 const path=recordPaths[type];
 if(!fields||!path){toast(`Unknown record type: ${type}`,false);return}
 let d={};document.querySelectorAll("#modalRoot [name]").forEach(x=>d[x.name]=x.value);
 const [requiredName,requiredLabel]=fields[0];
 if(!d[requiredName]){toast(`${requiredLabel} is required`,false);return}
 if(!key)d.createdAt=new Date().toISOString();
 try{
  if(type==="Health"&&["Sick","Emergency"].includes(d.status)){let a=findAnimal(d.animalId);if(a)await db.ref("animals/"+a.id).update({status:d.status})}
  if(type==="Calves"&&!key){
   // Blood Line only works off the Animal "motherId" field, so a birth record on its
   // own doesn't show up there. Auto-create (or link) the calf as a real Animal here.
   const mother=findAnimal(d.animalId);
   let calfId=(d.calfId||"").trim();
   if(!calfId)calfId=id("CALF");
   if(calfId===d.animalId){toast("Calf ID Mother ID jaisa nahi ho sakta — apne aap ki mother nahi ban sakti",false);return}
   if(motherChainIncludes(d.animalId,calfId)){toast("Yeh combination circular blood line banayegi — Calf ID check karein",false);return}
   if(findAnimal(calfId)){
    await db.ref("animals/"+calfId).update({motherId:d.animalId});
   }else{
    await save("animals",calfId,{id:calfId,name:"",gender:d.gender||"Female",type:"Calf",breed:mother?mother.breed:"",dob:d.birthDate||today(),shed:mother?mother.shed:"",status:"Healthy",earTag:"",joinedDate:today(),notes:d.notes||"",motherId:d.animalId,fatherId:"",deathDate:"",deathReason:""});
   }
   d.calfId=calfId;
  }
  await save(path,key||id(type.toUpperCase().replace(/ /g,"")),d);
  toast(`${type} record saved`);closeModal();
 }catch(e){toast(e.message,false)}
}
// One-time fixer: for any Calves birth record that doesn't have a matching Animal
// profile yet (e.g. added before this linking existed, or the Calf ID was edited later),
// create/relink that Animal so it shows up in Animals and in Blood Line.
async function repairCalfLinks(){
 const births=list("births");
 if(!births.length){toast("Koi birth record nahi mila",false);return}
 const ops=[];let fixed=0;
 for(const b of births){
  const mother=findAnimal(b.animalId);
  let calfId=(b.calfId||"").trim();
  if(calfId&&findAnimal(calfId)){
   const a=findAnimal(calfId);
   if(a.motherId!==b.animalId){ops.push(db.ref("animals/"+calfId).update({motherId:b.animalId}));fixed++}
   continue;
  }
  if(!calfId)calfId=id("CALF");
  if(calfId===b.animalId)continue; // skip bad data, same fix as the create-time guard
  if(findAnimal(calfId)){
   ops.push(db.ref("animals/"+calfId).update({motherId:b.animalId}));
  }else{
   ops.push(save("animals",calfId,{id:calfId,name:"",gender:b.gender||"Female",type:"Calf",breed:mother?mother.breed:"",dob:b.birthDate||today(),shed:mother?mother.shed:"",status:"Healthy",earTag:"",joinedDate:today(),notes:b.notes||"",motherId:b.animalId,fatherId:"",deathDate:"",deathReason:""}));
  }
  ops.push(db.ref("births/"+b.id).update({calfId}));
  fixed++;
 }
 if(!ops.length){toast("Sab birth records already Animal profile se linked hain");return}
 try{await Promise.all(ops);toast(`${fixed} birth record ka calf profile bana/link kiya gaya`)}catch(e){toast(e.message,false)}
}

// Shared month-wise summary builder — used for both cow milk (milkRecords) and
// insource milk (milkInsourceRecords), so the two tabs stay identical in shape.
function monthlyTotalTab(path){
 const map={};
 list(path).forEach(r=>{
  const m=(r.date||"").slice(0,7);
  if(!m)return;
  if(!map[m])map[m]={month:m,morning:0,evening:0,days:new Set()};
  map[m].morning+=Number(r.morning||0);
  map[m].evening+=Number(r.evening||0);
  map[m].days.add(r.date);
 });
 const months=Object.values(map).sort((a,b)=>b.month.localeCompare(a.month));
 return `<div class="card p-5">
  ${!months.length?`<div class="py-14 text-center text-stone-500">Abhi tak koi record nahi hai.</div>`:`
  <div class="rtable overflow-auto"><table class="w-full text-sm">
   <thead><tr class="border-b text-xs uppercase text-stone-500"><th class="p-3 text-left">Month</th><th class="p-3 text-left">Morning Total</th><th class="p-3 text-left">Evening Total</th><th class="p-3 text-left">Total Produced</th><th class="p-3 text-left">Days Recorded</th><th class="p-3 text-left">Avg / Day</th></tr></thead>
   <tbody>${months.map(m=>{const total=m.morning+m.evening;const dayCount=m.days.size||1;return `<tr class="border-b"><td class="p-3 font-semibold rt-main">${esc(m.month)}</td><td class="p-3" data-label="Morning Total">${m.morning.toFixed(1)} L</td><td class="p-3" data-label="Evening Total">${m.evening.toFixed(1)} L</td><td class="p-3 font-bold" data-label="Total Produced">${total.toFixed(1)} L</td><td class="p-3" data-label="Days Recorded">${dayCount}</td><td class="p-3" data-label="Avg / Day">${(total/dayCount).toFixed(1)} L</td></tr>`}).join("")}</tbody>

// ---- Feed stock engine ----
// Current stock = starting stock + every purchase - every daily-use entry, for that item.
function feedPurchasesFor(itemId){return list("feedPurchases").filter(p=>p.feedItemId===itemId)}
function feedUsageFor(itemId){return list("feedUsage").filter(u=>u.feedItemId===itemId)}
function feedStock(itemId){
 const it=list("feedInventory").find(x=>x.id===itemId);
 const opening=it?Number(it.openingStock||0):0;
 const purchased=feedPurchasesFor(itemId).reduce((s,p)=>s+Number(p.quantity||0),0);
 const used=feedUsageFor(itemId).reduce((s,u)=>s+Number(u.quantity||0),0);
 return opening+purchased-used;
}
// Average daily usage over the last 14 recorded usage-days — used to predict a run-out date.
function feedAvgDailyUsage(itemId){
 const rows=feedUsageFor(itemId).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,14);
 if(!rows.length)return 0;
 const total=rows.reduce((s,u)=>s+Number(u.quantity||0),0);
 const days=new Set(rows.map(r=>r.date)).size||1;
 return total/days;
}
function feedDaysRemaining(itemId){
 const avg=feedAvgDailyUsage(itemId);
 if(avg<=0)return null;
 return Math.floor(feedStock(itemId)/avg);
}
function feedRunOutDate(itemId){
 const d=feedDaysRemaining(itemId);
 return d===null?null:addDays(today(),d);
}

 if(!items.length)return header+`<div class="card p-5"><div class="py-14 text-center text-stone-500">Koi feed item nahi hai. Pehle ＋ Add Feed Item se item banayein.</div></div>`;
 const rowsHTML=items.map(it=>{

   <td class="p-3" data-label="Khatam Hoga">${days===null?"—":days<=0?"Aaj/kal khatm ho sakta hai":days+" din · "+fmt(runOut)}</td>
   <td class="p-3" data-label="Status">${low?`<span class="badge bg-red-100 text-red-800" title="Stock minimum se kam ya barabar hai">Low Stock</span>`:`<span class="badge bg-[#e2edd8] text-[#2e4a1f]">OK</span>`}</td>
   <td class="p-3 text-right rt-actions"><div class="flex gap-2 justify-end flex-wrap">
    ${viewOnly?`<span class="text-xs text-stone-500">View only</span>`:`<button class="btn btn-soft !p-2" onclick="openFeedPurchase('${esc(it.id)}')">📥 Purchase</button><button class="btn btn-soft !p-2" onclick="openFeedUsage('${esc(it.id)}')">📤 Daily Use</button><button class="btn btn-soft !p-2" onclick="openRecord('Feed','${esc(it.id)}')">Edit</button><button class="btn btn-danger !p-2" onclick="deleteRecord('Feed','${esc(it.id)}')">Delete</button>`}
   </div></td>
  </tr>`;
 }).join("");
 const table=`<div class="card p-5 rtable overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-xs uppercase text-stone-500">

// ---- Photo capture + compression + Cloudinary upload ----
// Animal photos only ever display at 40-130px on screen, so there's no reason to keep
// them at camera resolution (phone cameras shoot 8-12MP = 3-6MB originals). We resize to
// a small max dimension AND step the JPEG quality down until the file is comfortably
// under targetKB. This is what actually fixes "17 photos = 3-4MB" — that was happening
// because the old settings (1280px @ quality 0.72) kept files around 200-400KB each.
function compressImage(file,{maxDim=720,targetKB=90,minQuality=0.35}={}){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Could not read the selected file"));
  reader.onload=e=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("That file doesn't look like a valid image"));
   img.onload=()=>{
    let {width,height}=img;
    if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim}
    else if(height>=width&&height>maxDim){width=Math.round(width*maxDim/height);height=maxDim}
    const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,width,height); // flatten transparency, avoids black backgrounds on PNG->JPEG
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    ctx.drawImage(img,0,0,width,height);
    const qualities=[0.7,0.58,0.46,0.35];
    let i=0;
    (function tryQuality(){
     canvas.toBlob(blob=>{
      if(!blob){reject(new Error("Image compression failed"));return}
      const doneOnSize=blob.size/1024<=targetKB;
      const doneOnSteps=i>=qualities.length-1;
      if(doneOnSize||doneOnSteps){resolve(blob);return}
      i++;tryQuality();
     },"image/jpeg",qualities[i]);
    })();
   };
   img.src=e.target.result;
  };
  reader.readAsDataURL(file);
 });
}

// Uploads via XMLHttpRequest (not fetch) so we can show a live % progress bar — this is
// what makes the wait feel faster on slow mobile connections, on top of the file itself
// now being much smaller after compression.
function uploadToCloudinary(blob,onProgress){
 return new Promise((resolve,reject)=>{
  const fd=new FormData();
  fd.append("file",blob,"photo.jpg");
  fd.append("upload_preset",state.cloud.preset);
  fd.append("folder","gaushala/animals");
  const xhr=new XMLHttpRequest();
  xhr.open("POST",`https://api.cloudinary.com/v1_1/${state.cloud.name}/image/upload`);
  xhr.upload.onprogress=ev=>{if(ev.lengthComputable&&onProgress)onProgress(Math.round(ev.loaded/ev.total*100))};
  xhr.onload=()=>{
   let data;try{data=JSON.parse(xhr.responseText)}catch{data=null}
   if(xhr.status>=200&&xhr.status<300&&data)resolve(data);
   else reject(new Error(data?.error?.message||"Cloudinary upload failed"));
  };
  xhr.onerror=()=>reject(new Error("Network error during upload — check your internet connection"));
  xhr.send(fd);
 });
}
async function handlePhotoSelected(e){
 const file=e.target.files&&e.target.files[0];
 e.target.value="";
 if(!file)return;
 if(!state.cloud.name||!state.cloud.preset){toast("Add your Cloudinary Cloud Name and Upload Preset in Settings first",false);return}
 const statusEl=document.getElementById("photoStatus");
 try{
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-stone-400"></span> Compressing image...`;
  const originalKb=(file.size/1024).toFixed(0);
  const blob=await compressImage(file);
  if(statusEl)statusEl.innerHTML=`<span class="spinner border-stone-400"></span> Uploading ${fmtBytes(blob.size)} (was ${fmtBytes(file.size)}) — <span id="uploadPct">0%</span>`;
  const data=await uploadToCloudinary(blob,pct=>{const p=document.getElementById("uploadPct");if(p)p.textContent=pct+"%"});
  window.currentPhoto=data.secure_url;
  if(statusEl)statusEl.textContent=`Uploaded ✓ ${fmtBytes(blob.size)} (compressed from ${fmtBytes(file.size)}). Tap the photo below to view full size.`;
  const wrap=document.getElementById("photoPreviewWrap");

  toast("Photo uploaded");
  await db.ref("mediaLog/"+id("MED")).set({publicId:data.public_id,url:data.secure_url,bytes:blob.size,createdAt:new Date().toISOString()});
 }catch(err){
  if(statusEl)statusEl.textContent="Upload failed — try again ("+err.message+")";
  toast(err.message,false);
 }
}

 if(!cfg){toast("Report not available",false);return}
 const rows=cfg.rows();

 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({orientation:"landscape",unit:"pt"});
 doc.setFontSize(16);doc.setTextColor(20,83,45);doc.text(`Gaushala — ${key}`,40,36);
 doc.setFontSize(9);doc.setTextColor(100);doc.text(`Generated: ${fmt(today())} · Records: ${rows.length}`,40,52);
 const head=[cfg.columns.map(c=>c[0])];
 const body=rows.map(r=>cfg.columns.map(c=>{
  const v=typeof c[1]==="function"?c[1](r):r[c[1]];
  return (typeof c[1]==="string"&&c[1].toLowerCase().includes("date"))?fmt(v):(v===undefined||v===null||v===""?"—":String(v));
 }));
 doc.autoTable({head,body,startY:66,margin:{left:40,right:40},styles:{fontSize:8,cellPadding:5},headStyles:{fillColor:[22,101,52],textColor:255},alternateRowStyles:{fillColor:[240,253,244]}});
 doc.save(`gaushala-${key.toLowerCase().replace(/[^a-z0-9]+/g,"-")}-${today()}.pdf`);
 toast("PDF download shuru ho gayi");
}

// ---- Boot ----
// Only the paths a public bio-data profile actually needs (keeps the anonymous-scan
// load light and avoids pulling worker/expense/task data into a page anyone can open).
const PUBLIC_PROFILE_PATHS=["animals","milkRecords","pregnancies","healthChecks","vaccinations","deworming","tickControl","nailCutting"];
function bootPublicProfile(tagId){
 auth.signInAnonymously().catch(e=>console.warn("Anonymous Auth is not enabled.",e.message));
 let pending=PUBLIC_PROFILE_PATHS.length;
 PUBLIC_PROFILE_PATHS.forEach(p=>{
  let first=true;
  db.ref(p).on("value",s=>{
   state.data[p]=s.val()||{};
   if(first){first=false;pending--;if(pending===0)renderPublicProfile(tagId);}
   else if(document.querySelector(".bio-hero")||document.getElementById("app").children.length){renderPublicProfile(tagId);}
  },err=>{console.error(p,err);if(first){first=false;pending--;if(pending===0)renderPublicProfile(tagId);}});
 });
}
const scannedTag=new URLSearchParams(location.search).get("tag");
if(scannedTag){
 bootPublicProfile(scannedTag);
}else{
 auth.signInAnonymously().catch(e=>console.warn("Anonymous Auth is not enabled; configure Firebase Auth or use your own login.",e.message));
 loadAll().catch(e=>{document.getElementById("app").innerHTML=`<div class="p-10 max-w-2xl mx-auto"><div class="card p-6"><h1 class="text-xl font-bold text-red-700">Firebase connection error</h1><p class="mt-2 text-slate-600">${esc(e.message)}</p><p class="mt-3 text-sm text-stone-600">Check Realtime Database rules and enable Anonymous Authentication if using this starter.</p></div></div>`});
}
</script>
